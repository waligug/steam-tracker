name: Daily Snapshot

on:
  schedule:
    - cron: '0 14 * * *'   # 8 AM MST — a fixed hour keeps rank deltas comparable
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Take snapshot
        run: node dist/index.js --snapshot

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
